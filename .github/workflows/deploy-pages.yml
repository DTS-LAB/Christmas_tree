name: Deploy Christmas Tree to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f Christmas_tree-GitHub/package.json ]; then
            echo "PROJECT_DIR=Christmas_tree-GitHub" >> "$GITHUB_ENV"
          else
            echo "package.json not found in the repository root or Christmas_tree-GitHub/" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --prefix "$PROJECT_DIR"
      - name: Build site
        run: npm run build --prefix "$PROJECT_DIR"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
